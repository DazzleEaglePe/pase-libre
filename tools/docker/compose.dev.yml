name: paselibre-local

# Puertos corridos (5435 y 6382) para poder levantarlo junto al entorno de Yallegó.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paselibre
      POSTGRES_PASSWORD: paselibre_dev
      POSTGRES_DB: paselibre
    ports:
      - '${POSTGRES_PORT:-5435}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paselibre -d paselibre']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6382}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
